[tool.poetry]
name = "job-hunter-api"
version = "0.1.0"
description = "AI-powered job hunting automation - Email to application pipeline with CV adaptation"
authors = ["Javier Aguilar Martin <javiecija96@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
fastapi = ">=0.136.3,<0.137"
# Patched security cohort; keep parent bounds compatible with these floors.
starlette = ">=1.3.1,<1.4"
anyio = ">=4.14.2,<5"
certifi = ">=2026.10.19"
requests = ">=2.33,<3"
urllib3 = ">=2.8,<3"
idna = ">=3.15,<4"
pyasn1 = ">=0.6.4,<0.7"
pyjwt = {extras = ["crypto"], version = ">=2.15.1,<3"}
python-dotenv = ">=1.2.2,<2"
httplib2 = ">=0.32,<0.33"
oauthlib = ">=4,<5"
lxml = ">=6.1,<7"
pillow = ">=13,<14"
protobuf = ">=6.33.5,<7"
orjson = ">=3.11.6,<4"
soupsieve = ">=2.9,<3"
mako = ">=1.4.2,<2"
filelock = ">=3.20.3,<4"
pygments = ">=2.20,<3"
# passlib 1.7.4 cannot initialize the bcrypt 5 backend for existing hashes.
bcrypt = "4.3.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
pydantic = "^2.10.0"
pydantic-settings = ">=2.14.2,<3"
langfuse = "^2.54.0"
langgraph = ">=1.2.16,<2"
langgraph-checkpoint = ">=4.1.1,<5"
langgraph-sdk = ">=0.4.4,<1"
langchain-core = ">=1.7,<2"
mcp = ">=1.30,<2"
typer = "0.12.5"
google-api-python-client = "^2.150.0"
google-auth-oauthlib = "^1.2.0"
O365 = "^2.0.35"
httpx = "^0.28.0"
python-multipart = ">=0.0.32,<0.1"
cryptography = ">=50.0.2,<51"
aiosqlite = "^0.20.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
python-docx = "^1.1.0"
pypdf = ">=6.21.2,<7"
google-auth-httplib2 = "^0.2.1"
boto3 = "^1.42.8"
beautifulsoup4 = "^4.14.3"

# Browser Automation (Phase 2)
playwright = "^1.49.0"
websockets = ">=15,<16"
click = "8.1.7"
fpdf2 = "^2.8.5"
google-genai = "^1.56.0"
twocaptcha-python = "^0.0.4"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
email-validator = "^2.3.0"
html2text = "^2025.4.15"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=1.2,<2"
pytest-playwright = "^0.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
# Git-hook tooling is isolated in requirements-dev-tools.txt: patched virtualenv
# requires packaging>=26.3 while the retained Langfuse2 API requires packaging<25.

[tool.poetry.scripts]
job-hunter = "src.cli.commands:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long
    "B008",   # Function call in default arg (common FastAPI pattern)
    "B904",   # Raise without from (nice to have)
    "SIM102", # Collapsible if
    "SIM103", # Return bool directly
    "SIM105", # Suppressible exception
    "SIM108", # Ternary instead of if-else
    "SIM110", # Reimplemented builtin
    "SIM117", # Multiple with statements
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # sys.path modification requires imports after code
"alembic/versions/*" = ["ALL"]  # Auto-generated migration files
"scripts/*" = ["E402", "F401", "F841", "SIM"]  # Dev scripts: relaxed rules
"src/main.py" = ["E402"]  # FastAPI app structure requires scattered imports

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Relaxed type checking - can enable stricter rules gradually
check_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_return_any = false
warn_unused_ignores = false
# Ignore common issues in this codebase
disable_error_code = ["union-attr", "arg-type", "assignment", "return-value", "attr-defined", "var-annotated", "type-arg", "misc", "override", "call-overload", "dict-item", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
